[package]
name = "ado-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[lib]
name = "ado_core"
path = "src/lib.rs"

[[bin]]
name = "ado"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
libc = "0.2"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "macos-system-configuration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
unicode-general-category = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "ported"
path = "rust-tests/ported.rs"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
